[project]
name = "pyqa"
version = "0.1.0"
description = "Turn your PDFs into finetuning-ready QA datasets, using your own OCR and LLM endpoints."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pdf-inspector>=1.17",
    "pypdfium2>=5.13",
    "pillow>=10",
    "chonkie[semantic]>=1.7",
    "openai>=1.0",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "tenacity>=8",
]

[project.scripts]
pyqa = "pyqa.cli:run_cli"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyqa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Do not depend on the editable install: on macOS, uv writes the editable .pth
# with the UF_HIDDEN flag, and CPython's site.addpackage skips hidden .pth files,
# so the editable install silently stops working after any `uv sync`.
# Fix the CLI with: chflags nohidden .venv/lib/python*/site-packages/*.pth
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly so lint results do not depend on ambient config or on
# whichever rules a future ruff release turns on by default.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter
    "RUF012",  # ClassVar annotations on mutable defaults: noise for this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF018"]
