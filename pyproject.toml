[project]
name = "hootie"
version = "0.1.0"
description = "Turn your PDFs into finetuning-ready QA datasets, using your own OCR and LLM endpoints."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639: an SPDX expression plus the file. The legacy `{ text = "MIT" }` form
# and the "License ::" classifier are both deprecated, and recent PyPI rejects
# uploads that mix the classifier with an SPDX expression.
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Saiprasaad G", email = "81971795+saiprasaad2002@users.noreply.github.com" },
]
keywords = [
    "pdf", "ocr", "llm", "finetuning", "dataset", "synthetic-data",
    "question-answering", "chunking", "vllm", "openai", "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pdf-inspector>=1.17",
    "pypdfium2>=5.13",
    "pillow>=10",
    "chonkie[semantic]>=1.7",
    "openai>=1.0",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "tenacity>=8",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/saiprasaad2002/hootie"
Repository = "https://github.com/saiprasaad2002/hootie"
Issues = "https://github.com/saiprasaad2002/hootie/issues"
Changelog = "https://github.com/saiprasaad2002/hootie/blob/main/CHANGELOG.md"

[project.scripts]
hootie = "hootie.cli:run_cli"

# PEP 735 dependency group: uv installs this by default on `uv sync` / `uv run`,
# whereas an optional-dependencies extra is pruned unless every command passes
# --extra dev, which silently removes pytest and ruff mid-session.
[dependency-groups]
dev = [
    "cairosvg>=2.7",   # rasterizes the avatar and social preview; assets only
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hootie"]

[tool.hatch.build.targets.sdist]
# Ship the tests and fixtures so downstream packagers can verify a build.
include = [
    "src/hootie",
    "tests",
    "examples",
    "hootie.example.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Do not depend on the editable install: on macOS, uv writes the editable .pth
# with the UF_HIDDEN flag, and CPython's site.addpackage skips hidden .pth files,
# so the editable install silently stops working after any `uv sync`.
# Fix the CLI with: chflags nohidden .venv/lib/python*/site-packages/*.pth
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly so lint results do not depend on ambient config or on
# whichever rules a future ruff release turns on by default.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter
    "RUF012",  # ClassVar annotations on mutable defaults: noise for this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF018"]
