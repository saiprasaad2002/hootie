<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="hootie">
  <title>hootie</title>
  <g transform="translate(1 1) scale(1)">
    <!-- page, with a folded top-right corner -->
    <path d="M6 4.5h20.5L38 16v25.5a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V8.5a4 4 0 0 1 4-4z"
          fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>
    <path d="M26 4.5V13a3 3 0 0 0 3 3h9" fill="none" stroke="#475569"
          stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- lines of text on the page -->
    <g stroke="#CBD5E1" stroke-width="3" stroke-linecap="round">
      <path d="M13 24h13"/>
      <path d="M13 31h8"/>
    </g>
    <!-- conversation bubble: the page turning into question-and-answer pairs -->
    <path d="M32 27h20a5 5 0 0 1 5 5v13a5 5 0 0 1-5 5H43l-7.5 6.5V50h-3.5a5 5 0 0 1-5-5V32a5 5 0 0 1 5-5z"
          fill="#4F46E5"/>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.95">
      <path d="M36 36h13"/>
      <path d="M36 43h8"/>
    </g>
  </g>
</svg>
