# hootie configuration.
#
# Credentials are never passed on the command line. Use ${VAR} to read an
# environment variable, or ${VAR:-default} to supply a fallback. A referenced
# variable that is not set is an error at load time, rather than a confusing 401
# an hour into a long run.

# ---------------------------------------------------------------------------
# Vision: the only stage that sends page images to a model.
# Needed only when pages require OCR, carry figures, or have complex tables.
# Run `hootie inspect your.pdf` first — it projects the cost without spending it.
# ---------------------------------------------------------------------------
[vision]
describe_figures = true    # describe charts/diagrams on otherwise-readable pages
table_reread     = true    # re-read tables on complex layouts
dpi              = 200
max_image_edge   = 2000    # downscale before sending; keeps payloads sane
concurrency      = 8
# max_vision_pages = 100   # hard cap on billable pages; OCR is never dropped

[vision.endpoint]
model    = "Qwen/Qwen2.5-VL-7B-Instruct"
base_url = "http://localhost:8000/v1"
api_key  = "${HOOTIE_VISION_KEY:-not-needed}"

# Thresholds for deciding a page carries a figure worth describing.
# Tune these with `hootie inspect` against your own documents.
[vision.figures]
min_raster_area_ratio  = 0.05   # embedded images must cover this share of the page
min_vector_paths       = 12     # vector paths implying a drawn diagram
margin_band_ratio      = 0.10   # ignore paths in header/footer bands
boilerplate_page_ratio = 0.30   # an image on this share of pages is furniture

# ---------------------------------------------------------------------------
# Chunking. Runs locally: no credentials, no API cost.
# The default embedding model is a small Model2Vec model downloaded once from
# HuggingFace. In an air-gapped environment, pre-seed the HF cache first.
# ---------------------------------------------------------------------------
[chunk]
embedding_model = "minishlab/potion-base-32M"
threshold       = 0.8    # must be strictly between 0 and 1; lower = larger chunks
chunk_size      = 1024
skip_window     = 0      # >0 merges non-adjacent related passages
min_chunk_chars = 80

# ---------------------------------------------------------------------------
# Generation.
# ---------------------------------------------------------------------------
[generate]
pairs_per_chunk = 5
concurrency     = 8
system_prompt   = "You are a helpful assistant answering questions about the document."

[generate.endpoint]
model       = "Qwen/Qwen2.5-14B-Instruct"
base_url    = "http://localhost:8000/v1"
api_key     = "${HOOTIE_API_KEY:-not-needed}"
temperature = 0.3

# ---------------------------------------------------------------------------
# Grounding: drops answers not supported by their source chunk.
# Point this at a cheaper model than generation; it is a much easier task.
# Omit [ground.endpoint] to reuse the generation endpoint.
# ---------------------------------------------------------------------------
[ground]
enabled       = true
concurrency   = 8
keep_on_error = true   # a broken checker must not silently delete good data

[ground.endpoint]
model    = "Qwen/Qwen2.5-7B-Instruct"
base_url = "http://localhost:8000/v1"
api_key  = "${HOOTIE_API_KEY:-not-needed}"

# ---------------------------------------------------------------------------
# Output.
# ---------------------------------------------------------------------------
[output]
dir                 = "./out"
include_provenance  = false  # keep the training file clean; rejects always carry it
